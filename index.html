<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kimi 小圆球</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",system-ui,sans-serif;
    touch-action:none;user-select:none;color:var(--fg)}
  :root{
    --bg:#ffffff; --fg:#33415c; --muted:rgba(20,40,70,.30);
    --card:#ffffff; --cardBorder:rgba(74,144,226,.18); --cardShadow:rgba(30,60,110,.16);
    --chip:#f2f5fa; --chipOn:#4a86d8; --chipOnFg:#ffffff;
  }
  html[data-theme="dark"]{
    --bg:#131822; --fg:#e8edf7; --muted:rgba(232,237,247,.34);
    --card:#1d2431; --cardBorder:rgba(255,255,255,.10); --cardShadow:rgba(0,0,0,.42);
    --chip:#262f3e; --chipOn:#5a95e0; --chipOnFg:#ffffff;
  }
  /* 提升到独立合成层：画布内容直接作为 GPU 纹理参与合成，不参与主线程的层树重绘 */
  #stage{display:block;position:fixed;inset:0;z-index:1;
    transform:translateZ(0);will-change:transform;contain:strict}
  .hint{position:fixed;bottom:24px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.04em;
    color:var(--muted);pointer-events:none;padding:0 20px;line-height:1.6;z-index:2}

  /* 右上角齿轮 */
  #gear{position:fixed;top:14px;right:14px;width:44px;height:44px;border:0;border-radius:50%;
    background:var(--card);color:var(--fg);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 12px var(--cardShadow);cursor:pointer;z-index:5;
    transition:transform .45s cubic-bezier(.22,1,.36,1), background .25s}
  #gear:active{transform:scale(.92) rotate(-25deg)}
  #gear svg{width:22px;height:22px}

  /* 设置面板：桌面右侧抽屉 / 手机底部半屏 sheet。
     关键是 #panel 本身 pointer-events:none —— 面板外的区域不做拦截，
     所以调色时左侧/上方的 Kimi 一直露着，还能顺手戳一下。 */
  #panel{position:fixed;inset:0;z-index:10;display:flex;pointer-events:none;opacity:0;
    align-items:flex-end;justify-content:center;
    transition:opacity .30s cubic-bezier(.22,1,.36,1), visibility 0s linear .30s}
  #panel.open{opacity:1;visibility:visible;transition:opacity .30s cubic-bezier(.22,1,.36,1)}
  #panel:not(.open){visibility:hidden}
  #panel .sheet{pointer-events:auto;background:var(--card);overflow-y:auto;
    width:100%;max-height:62vh;border-radius:20px 20px 0 0;
    padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%);
    border-top:1px solid var(--cardBorder);
    box-shadow:0 -8px 40px var(--cardShadow);
    transition:transform .38s cubic-bezier(.22,1,.36,1)}
  #panel.open .sheet{transform:none}
  @media (min-width:768px) and (orientation:landscape){
    #panel{align-items:stretch;justify-content:flex-end}
    #panel .sheet{width:min(400px,84vw);height:100vh;max-height:100vh;
      border-radius:20px 0 0 20px;transform:translateX(100%);
      padding:26px 24px;border:0;border-left:1px solid var(--cardBorder);
      box-shadow:-8px 0 40px var(--cardShadow)}
  }


  .sheet h2{margin:0 0 4px;font-size:21px;font-weight:600}
  /* 光晕层：三个大圆交给 DOM + CSS 合成，不进 canvas 主循环。
     原来每帧在 canvas 里填充三个大半径半透明渐变，是最大的性能瓶颈。 */
  #halos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #halos i{position:absolute;left:0;top:0;border-radius:50%;display:block;
    will-change:transform;backface-visibility:hidden;transform-origin:50% 50%;
    contain:layout paint size}
  #haloBg{position:fixed;inset:0;z-index:-1}
  .sheet .sub{margin:0 0 26px;font-size:12.5px;color:var(--muted)}
  .sec{margin-bottom:26px}
  .sec h3{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:42px;height:42px;border-radius:50%;border:2px solid transparent;cursor:pointer;
    padding:0;position:relative;transition:transform .2s cubic-bezier(.22,1,.36,1)}
  .sw:active{transform:scale(.9)}
  .sw.on{border-color:var(--fg)}
  .sw i{position:absolute;inset:4px;border-radius:50%;display:block}
  .seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
  .seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:13.5px;
    padding:9px 20px;border-radius:9px;cursor:pointer;transition:background .22s,color .22s}
  .seg button.on{background:var(--chipOn);color:var(--chipOnFg)}
  .crow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .clab{width:60px;font-size:13px;color:var(--muted);flex:none}
  .cval{width:44px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .crow input[type=range]{flex:1;-webkit-appearance:none;height:26px;background:transparent}
  .crow input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--chip)}
  .crow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;
    border-radius:50%;background:var(--chipOn);margin-top:-7px;border:2px solid var(--card)}
  .crow input[type=color]{width:44px;height:30px;border:0;border-radius:8px;padding:0;background:none;cursor:pointer}
  .mini{border:0;background:var(--chip);color:var(--fg);font:inherit;font-size:12.5px;
    padding:7px 14px;border-radius:9px;cursor:pointer}
  input[type=range].hue::-webkit-slider-runnable-track{
    background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  input[type=range].sat::-webkit-slider-runnable-track{background:var(--satTrack,#ddd)}
  input[type=range].lit::-webkit-slider-runnable-track{background:var(--litTrack,#ddd)}
  .pv{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  /* 文案输入：三条，分别对应「狂点」时弹出的三句话 */
  .txt{width:100%;box-sizing:border-box;margin-bottom:10px;padding:9px 12px;
    border:1px solid var(--cardBorder);border-radius:10px;background:var(--chip);
    color:var(--fg);font:inherit;font-size:13px}
  .txt:focus{outline:2px solid var(--chipOn);outline-offset:1px}
  .secnote{margin:-4px 0 12px;font-size:11.5px;color:var(--muted);line-height:1.5}
  .pv.hsl{margin-right:auto}
  .foot{margin-top:8px}
  .back{border:0;background:var(--chip);color:var(--fg);font:inherit;font-size:14px;
    padding:12px 26px;border-radius:12px;cursor:pointer;transition:transform .18s}
  .back:active{transform:scale(.96)}

  /* 下载 APK：设置面板底部的圆形按钮 */
  .dlsec .crow{margin-bottom:8px}
  .dlbtn{width:52px;height:52px;border-radius:50%;border:0;flex:none;
    background:var(--chipOn);color:var(--chipOnFg);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 2px 10px var(--cardShadow);
    transition:transform .18s cubic-bezier(.22,1,.36,1), opacity .2s}
  .dlbtn:active{transform:scale(.9)}
  .dlbtn[disabled]{opacity:.55;cursor:default}
  .dlbtn svg{width:24px;height:24px}
  .dltxt{font-size:13.5px;color:var(--fg)}

  /* 自制确认弹窗：不用原生 confirm，样式跟页面统一。
     关闭时 inert + visibility:hidden，否则 3 个按钮仍会被 Tab 聚焦。 */
  #ask{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:24px;opacity:0;pointer-events:none;
    background:rgba(10,20,40,.34);backdrop-filter:blur(2px);
    transition:opacity .26s cubic-bezier(.22,1,.36,1), visibility 0s linear .26s;
    visibility:hidden}
  #ask.open{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .26s cubic-bezier(.22,1,.36,1)}
  #ask .box{width:100%;max-width:330px;background:var(--card);border-radius:20px;
    padding:24px 22px 18px;box-shadow:0 12px 48px var(--cardShadow);
    transform:scale(.9) translateY(10px);opacity:0;
    transition:transform .32s cubic-bezier(.22,1,.36,1), opacity .26s}
  #ask.open .box{transform:none;opacity:1}
  #ask h4{margin:0 0 10px;font-size:17px;font-weight:600;color:var(--fg)}
  #ask .askmsg{margin:0 0 20px;font-size:13.5px;line-height:1.65;color:var(--muted)}
  #ask .askmsg b{color:var(--fg);font-weight:600}
  #ask .acts{display:flex;gap:10px}
  #ask .acts button{flex:1;border:0;font:inherit;font-size:14px;padding:12px 0;
    border-radius:12px;cursor:pointer;transition:transform .18s}
  #ask .acts button:active{transform:scale(.96)}
  #askNo{background:var(--chip);color:var(--fg)}
  #askYes{background:var(--chipOn);color:var(--chipOnFg)}
  /* 平台选择：两个卡片单选，默认高亮当前平台 */
  #ask .plat{display:flex;flex-direction:column;gap:8px;margin:0 0 18px}
  .pbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;
    border:1.5px solid var(--cardBorder);background:var(--chip);color:var(--fg);
    font:inherit;text-align:left;padding:11px 14px;border-radius:12px;cursor:pointer;
    transition:border-color .2s, background .2s, transform .16s}
  .pbtn:active{transform:scale(.985)}
  .pbtn b{font-size:14px;font-weight:600}
  .pbtn span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pbtn.on{border-color:var(--chipOn);background:color-mix(in srgb, var(--chipOn) 12%, var(--chip))}
  #ask .prog{margin:0 0 18px}
  #ask .bar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
  #ask .bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--chipOn);
    transition:width .2s ease-out}
  #ask .ptxt{margin:9px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="halos" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="stage"></canvas>
<div class="hint">按住任意处它会看你 · 抓住它拖着甩出去 · 狂点试试</div>

<button id="gear" aria-label="设置">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<div id="panel" inert aria-hidden="true">
  <div class="sheet">
    <h2>设置</h2>
    <p class="sub">调整 Kimi 的颜色与外观</p>
    <div class="sec">
      <h3>样式</h3>
      <div class="seg" id="styleSeg">
        <button data-style="ball">原版</button>
        <button data-style="crab">龙虾</button>
      </div>
    </div>
    <div class="sec">
      <h3>KIMI 颜色</h3>
      <div class="row" id="swatches"></div>
    </div>
    <div class="sec">
      <h3>自定义颜色</h3>
      <div class="crow">
        <span class="clab">色相</span>
        <input type="range" id="hueR" class="hue" min="0" max="360" step="1">
        <span class="cval" id="hueV">215</span>
      </div>
      <div class="crow">
        <span class="clab">饱和度</span>
        <input type="range" id="satR" class="sat" min="0" max="100" step="1">
        <span class="cval" id="satV">65</span>
      </div>
      <div class="crow">
        <span class="clab">明度</span>
        <input type="range" id="litR" class="lit" min="22" max="86" step="1">
        <span class="cval" id="litV">57</span>
      </div>
      <div class="crow">
        <span class="pv" id="pickHex">#4a86d8</span>
        <button class="mini" id="resetC">恢复默认</button>
      </div>
    </div>
    <div class="sec">
      <h3>外观</h3>
      <div class="seg" id="themeSeg">
        <button data-theme="light">浅色</button>
        <button data-theme="dark">深色</button>
      </div>
    </div>
    <div class="sec">
      <h3>大小与透明度</h3>
      <div class="crow">
        <span class="clab">大小</span>
        <input type="range" id="sizeR" min="50" max="200" step="5" aria-label="主角大小">
        <span class="cval" id="sizeV">100%</span>
      </div>
      <div class="crow">
        <span class="clab">透明度</span>
        <input type="range" id="alphaR" min="20" max="100" step="1" aria-label="主角透明度">
        <span class="cval" id="alphaV">100%</span>
      </div>
    </div>
    <div class="sec">
      <h3>对话文案</h3>
      <p class="secnote" id="lineHint">狂点时依次弹出这三句（当前：原版）</p>
      <input type="text" class="txt" id="line0" maxlength="40" aria-label="第一句话">
      <input type="text" class="txt" id="line1" maxlength="40" aria-label="第二句话">
      <input type="text" class="txt" id="line2" maxlength="40" aria-label="第三句话">
      <div class="crow">
        <button class="mini" id="resetL">恢复默认</button>
      </div>
    </div>
    <div class="sec dlsec">
      <div class="crow">
        <button class="dlbtn" id="dlBtn" aria-label="下载桌宠">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/>
          </svg>
        </button>
        <span class="dltxt">下载桌宠</span>
      </div>
      <p class="secnote">安卓 APK 悬浮窗版 · Windows 桌面宠物</p>
    </div>
    <div class="foot"><button class="back" id="backBtn">返回</button></div>
  </div>
</div>

<div id="ask" inert aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="askT">
  <div class="box">
    <h4 id="askT">下载桌宠</h4>
    <div id="askBody">
      <p class="askmsg">是否要下载<b>桌宠</b>？请选择平台：</p>
      <div class="plat" role="radiogroup" aria-label="选择平台">
        <button class="pbtn" id="pApk" role="radio" aria-checked="false">
          <b>安卓 APK</b><span id="apkMeta">悬浮窗版</span>
        </button>
        <button class="pbtn" id="pExe" role="radio" aria-checked="false">
          <b>Windows 桌面宠物</b><span id="exeMeta">读取信息中…</span>
        </button>
      </div>
    </div>
    <!-- 提示层单独放，不销毁上面的节点 —— 否则平台按钮的引用会失效 -->
    <div class="prog" id="dlProg" hidden><p class="ptxt">正在打开下载…</p></div>
    <div class="acts">
      <button id="askNo">取消</button>
      <button id="askYes">确认下载</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
/* GPU 加速上下文：
   desynchronized → 允许浏览器把绘制提交到 GPU 后不阻塞主线程（低延迟模式）
   alpha:true     → 画布透明，让 DOM 光晕层从下面透上来（见 #halos）
   不设 willReadFrequently → 否则 Chrome 会强制回退到 CPU 光栅化，白白丢掉 GPU */
const cv=document.getElementById('stage');
const ctx=cv.getContext('2d',{alpha:true, desynchronized:true, willReadFrequently:false});
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* 自适应分辨率：手机 DPR3 的画布有 1170×2532 个像素，每帧全屏填充 + 合成，
   光栅化量是 DPR2 的 2.25 倍 —— 这是中低端机上掉帧最大的单一因素。
   画面主体是柔和渐变和大色块，2× 与 3× 的差别肉眼几乎看不出，
   所以持续掉帧时把上限降到 2，换回一倍余量（只降一次，避免在临界点来回抖动）。 */
let dprCap=3, dprSlow=0;
let W=0,H=0,DPR=1,S=6;
/* 大小倍率单独放一个变量：resize() 在脚本早期就被调用，那时 CFG 还没初始化，
   直接用 CFG.sizeK 会撞 TDZ（Cannot access 'CFG' before initialization）。 */
let SIZE_K=1;
function resize(){
  DPR=Math.max(1,Math.min(Math.round(window.devicePixelRatio||1),dprCap));
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* 主角大小分两套：手机竖屏按短边放大（原来只占屏宽 43%，太小），
     横屏/桌面保持原来的桌面宠物尺寸。
     位置放在 draw() 里更新 —— resize() 在脚本早期就被调用，那时 CFG 还没初始化。 */
  const vmin=Math.min(W,H), k=SIZE_K;
  S = (H>W) ? clamp(Math.round(vmin*0.60/24*k),6,Math.round(30*k))
            : clamp(Math.round(vmin*0.44/24*k),3,Math.round(26*k));
}
/* 构图：竖屏主角居中偏上，横屏走三分法右下角。
   面板打开时主角主动让位（竖屏上移、横屏左移），保证调色时它是完整露着的。
   位置用缓动逼近目标，不会硬跳。 */
let posXCur=null, posYCur=null;
function applyLayout(){
  const open=typeof panel!=='undefined' && panel.classList.contains('open');
  let tX,tY,tBX,tBY;
  if(H>W){ tX=0.50; tY=open?0.26:0.46; tBX=0.50; tBY=0.20; }   // 竖屏
  else   { tX=open?0.42:2/3; tY=2/3; tBX=1/3; tBY=1/3; }        // 横屏/桌面
  if(posXCur===null){ posXCur=tX; posYCur=tY; }
  else { posXCur+=(tX-posXCur)*0.12; posYCur+=(tY-posYCur)*0.12; }
  CFG.posX=posXCur; CFG.posY=posYCur; CFG.bubbleX=tBX; CFG.bubbleY=tBY;
}
window.addEventListener('resize',resize);resize();

/* 平滑矢量绘制：坐标即屏幕像素，无像素网格量化 */
const sx=x=>cx0+x*S, sy=y=>cy0+y*S;
/* 眼睛专用缩放：眼随球一起缩（点击内缩时眼睛同步变小） */
let ES=S;
const ex_=x=>cx0+x*ES, ey_=y=>cy0+y*ES;
let cx0=0, cy0=0;

/* ---------------- 外观 ---------------- */
const SKIN={                      // 中心深、边缘浅：外面一层浅的，里面裹着一个深的
  core:'#4a86d8', in1:'#5a95e0', in2:'#6ca4e8', edge:'#8cb9f0', rim:'#a9cdf6'
};

/* ---------------- 龙虾配色 ----------------
   默认（色相 215）就是图片里的 红身 + 蓝面罩。
   调色时按「相对默认色相的偏移」整体平移，红蓝关系保持不变。 */
function crabPal(){
  // 原图就是大色块平涂：红身三档、蓝罩两档，全部硬边纯色、无渐变。
  // 色值由原图 K-means 取色换算成 HSL；拖色相滑块时整体平移，红/蓝关系不变。
  /* 色值 = 原图每一档出现次数最多的那个颜色（众数，不是平均色）换算成的 HSL：

     红亮 rgb(253,102,93)→H3  S98 L68 ／ 蓝暗 rgb(44,142,231)→H209 S80 L54
     蓝亮 rgb(81,160,255)→H213 S100 L66
     拖色相滑块时整体平移，红蓝相对关系保持不变。 */
  const off=(((hueH-215)%360)+360)%360;
  const bh=(3+off+360)%360;
  const k=(clamp(hueL,45,66)-57)/57;
  return {
    b1 : hsl(bh, 98, clamp(68+k*9,34,90)),   // 红亮 37%  rgb(253,102,93)
    b2 : hsl(bh, 75, clamp(56+k*9,26,84)),   // 红中（底）rgb(227,70,61)
    b3 : hsl((357+off+360)%360, 72, clamp(44+k*9,20,70)), // 红暗 8% rgb(193,32,40)
    eyeHi : '#ffffff',
    m1 : hsl((213+off+360)%360, 100, clamp(66+k*9,36,86)), // 蓝亮 65% rgb(81,160,255)
    m2 : hsl((209+off+360)%360, 80, clamp(54+k*9,26,80)),  // 蓝暗 35% rgb(44,142,231)
    eye: '#141821'
  };
}

function toRGB(c){
  if(c[0]==='#'){
    let hx=c.slice(1);
    if(hx.length===3) hx=hx.split('').map(ch=>ch+ch).join('');
    const n=parseInt(hx,16);
    return [(n>>16&255),(n>>8&255),(n&255)];

  const m=c.match(/-?[\d.]+/g);
  if(!m) return [255,255,255];
  const h=+m[0], sa=+m[1]/100, l=+m[2]/100;
  const k=n=>(n+h/30)%12, a=sa*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));
  return [f(0),f(8),f(4)];
}

/* HSL 的 L 是「数学均匀」的，不是人眼均匀：同样 L=57，绿色比蓝色亮 2.25 倍。

   解决办法：以原版配色五层的「感知亮度」为准，对每个色相反解出该用的 L。 */
const SKIN_LUM=[0.2346,0.2905,0.3557,0.4656,0.5875];   // 原版五层实测感知亮度
const SKIN_LRAT=SKIN_LUM.map(v=>v/SKIN_LUM[0]);        // 层间亮度比（与色相无关）
const SKIN_SOFF=[0,3.9,8.4,12.4,16.6];                 // 层间饱和度偏移（越外层越艳）
const SKIN_HOFF=[0,-1.0,-1.7,-1.6,-2.7];               // 层间色相偏移

/* hsl → rgb（0~255） */
function hslRgb(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))));
  return [f(0),f(8),f(4)];
}
/* 感知亮度（sRGB gamma 校正后的相对亮度） */
function relLum(r,g,b){
  const f=v=>{v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);
}
/* 二分反解：给定色相/饱和度，求让感知亮度等于 target 的 L */
function lForLum(h,s,target){
  let lo=0, hi=100;
  for(let i=0;i<22;i++){
    const mid=(lo+hi)/2, c=hslRgb(h,s,mid);
    if(relLum(c[0],c[1],c[2])<target) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}

function skinFromHue(h,sat,lit){
  const s=(sat==null?hueS:sat), l=(lit==null?hueL:lit);
  // 滑块给的是 core 的明度意愿，线性映射到 core 的目标感知亮度
  const coreLum=cl(SKIN_LUM[0]*(l/56.9), 0.045, 0.60);
  const keys=['core','in1','in2','edge','rim'];
  for(let i=0;i<keys.length;i++){
    const ss=cl(s+SKIN_SOFF[i],0,100);
    SKIN[keys[i]]=hsl((h+SKIN_HOFF[i]+360)%360, ss, lForLum((h+SKIN_HOFF[i]+360)%360, ss, cl(coreLum*SKIN_LRAT[i],0.02,0.94)));
  }
}
function hsl2hex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));
  return '#'+[f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
/* hex → hsl（保留备用） */
function hexToHsl(hex){
  hex=hex.replace('#',''); if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if(d){
    if(mx===r) h=((g-b)/d+(g<b?6:0));
    else if(mx===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;
  }
  const l=(mx+mn)/2;
  const s=d===0?0:d/(1-Math.abs(2*l-1));
  return {h:Math.round(h), s:Math.round(s*100), l:Math.round(l*100)};
}

/* ---------------- 球面投影 ----------------
   眼睛贴在球面上：往四周看 = 沿球面滑动，位置由球面角度投影得到。
   两只眼永远「平行」：倾角只由注视方向决定，两眼共用同一个角度，
   所以不会一只内八一只外八；尺寸恒定，不做近大远小。 */
let sharedRot=0;
function updateSharedRot(gx,gy){
  // 用「脸的中心」算倾角：两眼共用，保证永远平行
  const R=CFG.bodySize/2;
  const MA=CFG.eyeMove*CFG.range/R*CFG.turnK;
  const Ax=gx*MA;                        // 中心点：基础 ax = 0
  const Ay=CFG.eyeY/R + gy*MA*CFG.eyeMoveY;
  // up 向量投影：往右看 (Ax>0) 且眼睛在球心上方 (Ay<0) → up 偏向左上 → 逆时针
  sharedRot=CFG.roll*Math.atan2(Math.sin(Ay)*Math.sin(Ax), Math.cos(Ay));
}
function eyePose(bx,by,gx,gy){
  const R=CFG.bodySize/2;                       // 球半径（逻辑像素）
  const MA=CFG.eyeMove*CFG.range/R*CFG.turnK;   // 最大转动角（弧度）
  const ax=bx/R + gx*MA;                        // 基础角 + 转动角
  const ay=by/R + gy*MA*CFG.eyeMoveY;
  const ca=Math.cos(ay), sa=Math.sin(ay);
  const cA=Math.cos(ax), sA=Math.sin(ax);
  return {
    x : sA*ca*R,          // 正交投影：位置（自带球面压缩）
    y : sa*R,             // 屏幕 y 向下为正
    rot: sharedRot        // 两眼共用倾角 → 始终平行
  };
}

  ptr.x=e.clientX; ptr.y=e.clientY;
  if(!DRAG.on) return;
  const now=performance.now();
  DRAG.samples.push({x:e.clientX, y:e.clientY, t:now});
  // 只留最近一小段轨迹，甩出去的速度看的就是这段
  while(DRAG.samples.length>2 && now-DRAG.samples[0].t>140) DRAG.samples.shift();
  if(Math.hypot(e.clientX-DRAG.sx, e.clientY-DRAG.sy)>CFG.dragMovePx) DRAG.moved=true;
  if(!DRAG.moved) return;
  // 只记目标点；真正的位移由每帧的弹簧追过去，所以不管指针事件多密都是顺滑的
  DRAG.tx=e.clientX+DRAG.offX; DRAG.ty=e.clientY+DRAG.offY;
}
window.addEventListener('pointermove',onMove,{passive:true});

function onDown(e){
  if(panel.classList.contains('open')) return;   // 设置界面开着 → 不操作画布
  ptr.x=e.clientX; ptr.y=e.clientY;
  holding=true;                                 // 按住 → 开始盯着看（不限位置）
  onBall = Math.hypot(e.clientX-cx0, e.clientY-cy0)<=bodyR()*S*1.25;
  onBallFling = onBall;
  if(onBall) FL.holdT0=performance.now();
  FL.charging=onBall;
  // 按在球上 → 进入「抓住」状态（龙虾不参与拖拽投掷，保持它自己的手感）
  if(onBall && styleMode!=='crab'){
    const now=performance.now();
    DRAG.on=true; DRAG.moved=false; DRAG.sx=e.clientX; DRAG.sy=e.clientY;
    DRAG.offX=(W*CFG.posX+FL.x)-e.clientX;
    DRAG.offY=(H*CFG.posY+FL.y)-e.clientY;
    DRAG.tx=W*CFG.posX+FL.x; DRAG.ty=H*CFG.posY+FL.y;
    DRAG.vx=0; DRAG.vy=0; DRAG.has=false;
    DRAG.samples=[{x:e.clientX, y:e.clientY, t:now}];
    /* 飞行中按到它 → 一把接住，立刻停住（不是拍它一下让它飞更远）。
       接住后交回手指控制：拖着走就跟手，原地松手就停在那儿。 */
    if(FL.flying){
      FL.flying=false; FL.vx=0; FL.vy=0; FL.homeT=now;
      sqV += 4;                        // 接住那一下挤一下
      TRAIL.length=0;                  // 残影立刻清掉，不然会拖着一串
    }
  }
  if(onBall) onTap(e);                          // 按在球上 → 点它
}
function onRelease(e){
  if(!holding) return;
  holding=false; onBall=false;
  const now=performance.now();

  /* 拖拽投掷：拖过就按手速甩出去。放在最前面处理 —— 后面几个分支都是 return，
     放后面会导致 DRAG 状态残留，下一次按下就乱了。 */
  if(DRAG.on){
    DRAG.on=false;
    // 用「球自己的速度」而不是手指速度 —— 拖着不动再松手就是放下，甩起来才飞
    if(DRAG.moved && DRAG.has){
      let vx=DRAG.vx*CFG.dragFlingK, vy=DRAG.vy*CFG.dragFlingK;
      const sp=Math.hypot(vx,vy);
      if(sp>CFG.dragFlingMax){ vx=vx/sp*CFG.dragFlingMax; vy=vy/sp*CFG.dragFlingMax; }
      if(sp>=CFG.dragMinSpd){
        FL.vx=vx; FL.vy=vy;
        FL.flying=true; FL.homeT=-99999; FL.t0=now;
        FL.lx=undefined; FL.ly=undefined;
        sqV += (FL.vx+FL.vy)*0.0011;            // 甩出去那一下挤一下
      }
    }
    DRAG.samples=[]; DRAG.moved=false; DRAG.has=false;
    DRAG.vx=0; DRAG.vy=0;
  }
  eyes.nextGaze=now+300;

  // 有对话框时：长按它 → 对话框消失（不弹飞）
  if(bubbleShown){
    if(now-FL.holdT0>=CFG.flingHoldMs){
      bubbleShown=false; closeTaps=0; totalTaps=0;
    }
    return;
  }

  onBallFling=false;
}
window.addEventListener('pointerdown',onDown,{passive:true});
window.addEventListener('pointerup',onRelease,{passive:true});
window.addEventListener('pointercancel',onRelease,{passive:true});
window.addEventListener('blur',onRelease);

/* 点球：果冻 + 生气计数 */
function onTap(e){
  const now=performance.now();
  holdT0=now;
  // 不再直接把 press 跳到峰值：由弹簧平滑长过去，这样「变大」才看得出动画
  // 龙虾：点一下不再甩爪（爪子与尾巴保持静止）；点击仍照常记生气 / 对话框次数
  if(styleMode!=='crab'){
    popUntil=now+CFG.popGrowMs+CFG.popHoldMs;  // 生长阶段 + 悬停阶段
  }else{
    crabPopT0=now;                             // 龙虾：先缩小再弹回放大
  }
  if(bubbleShown){
    // 对话框开着时：点两下就关掉，并重置计数（下次再点满会再弹）
    closeTaps++;
    if(closeTaps>=CFG.closeTaps){
      bubbleShown=false; closeTaps=0; totalTaps=0;
    }
  }else if(!FL.flying){
    // 只有不在飞的时候才累计对话框次数
    totalTaps++;
    if(totalTaps>=CFG.bubble){
      bubbleIdx=(bubbleIdx+1)%curLinesArr().length;  // 每次弹出换下一段
      bubbleShown=true; bubbleT0=now; closeTaps=0;
    }
  }
  if(now<rageUntil) return;                     // 正在生气：只缩，不续气
  combo = (now-lastTap<RAGE_WINDOW)? combo+1 : 1;
  lastTap=now;
  if(combo>=RAGE_TAPS){
    const extra=Math.min(combo-RAGE_TAPS,10)*380;
    rageUntil=Math.max(rageUntil, now+RAGE_COOL+extra);
  }
}

function doBlink(){
  const now=performance.now();
  // 正在生气就不眨，免得怒目被打断；把下次眨眼推到气消之后
  if(now<rageUntil){ blink.next=rageUntil+rand(300,700); return; }
  if(now-blink.t0>blink.dur){blink.t0=now;blink.dur=rand(150,230);}
  blink.next=now+1000/(0.05+CFG.blink*0.6)*rand(.55,1.6);
}
blink.next=performance.now()+900;

function step(now,dt){
  const ds=Math.min(dt,40)/1000;
  // 缩放目标：生长+悬停期内趋向「胀大」，之后回落（按在球上则略缩）
  const popping = now<popUntil && styleMode!=='crab';
  // 龙虾被按不放大，只甩爪子
  let pT;
  if(styleMode==='crab'){
    const dt0=now-crabPopT0;
    if(dt0 < CFG.crabShrinkMs)                 pT =  CFG.crabShrink;   // 先缩
    else if(dt0 < CFG.crabShrinkMs+CFG.crabGrowMs) pT = -CFG.crabGrow; // 再胀
    else                                        pT = 0;                // 回位
  }else{
    pT = popping ? -CFG.pressPop : ((holding&&onBall) ? CFG.pressHold : 0);
  }
  // 生长阶段用更软的弹簧 → 变大是一个看得见的过程；回落阶段稍硬 → 果冻回弹
  const st1 = (styleMode==='crab') ? CFG.crabPopStiff : (popping ? CFG.popGrowStiff : 150), z1=.42, d1=2*Math.sqrt(st1)*z1;
  const steps=Math.max(1,Math.ceil(ds/(1/240))), h=ds/steps;
  for(let i=0;i<steps;i++){
    pressV+=((pT-press)*st1 - pressV*d1)*h; press+=pressV*h;
  }
  // 形变由「缩放速度」派生：动的时候被挤压，停下来就恢复正圆
  // （不再是独立弹簧，所以不会自己来回晃个不停）
  sq = clamp(pressV*CFG.jellyK, -CFG.jellyMax, CFG.jellyMax);

  /* 运动形变：取自球「当前真正拥有」的速度 —— 拖着走用拖拽速度，飞出去用飞行速度。
     平滑后再算拉伸量与方向；速度趋近 0 时拉伸量趋近 0，角度冻结不更新，
     所以按住不动时它是稳定的，不会自己一会长一会短。 */
  let mvx=0, mvy=0;
  if(DRAG.on && DRAG.moved){ mvx=DRAG.vx; mvy=DRAG.vy; }
  else if(FL.flying){ mvx=FL.vx; mvy=FL.vy; }
  stepImpact(now,ds);
  const mk=1-Math.exp(-ds/CFG.motionTau);
  MOTION.vx+=(mvx-MOTION.vx)*mk; MOTION.vy+=(mvy-MOTION.vy)*mk;
  const msp=Math.hypot(MOTION.vx,MOTION.vy);
  MOTION.amt=clamp(msp/CFG.motionRefSpd,0,1)*CFG.motionStretch;
  if(msp>60) MOTION.ang=Math.atan2(MOTION.vy,MOTION.vx);   // 太慢时角度无意义，保持不变
  // 怒气：起得快，消得更快（目标为 0 时几乎瞬间回落）
  const target = now<rageUntil ? 1 : 0;
  const tau = target?0.10:0.05;
  rage += (target-rage)*(1-Math.exp(-ds/tau));
  if(now<lastTap-RAGE_WINDOW) combo=0;
  autoMood = rage>0.30 ? 'angry' : null;

  if(holding){
    // 按着的时候盯着手指/鼠标看：指针离球心越远，看得越"使劲"
    const dx=ptr.x-cx0, dy=ptr.y-cy0, d=Math.hypot(dx,dy)||1;
    const sat=Math.max(1, bodyR()*S*0.8);
    const n=d/(d+sat);                        // 0~1，越远越接近 1
    gaze.tx=dx/d*n; gaze.ty=dy/d*n;
    eyes.nextGaze=now+1e9;                    // 按住期间不自动换方向
  }else if(now>eyes.nextGaze){
    // 没人按：自己向四周看（换方向的间隔拉长，不再频繁乱瞟）
    gaze.tx=rand(-1,1)*.85; gaze.ty=rand(-1,1)*.7;
    eyes.nextGaze=now+rand(1400,3400);
  }
  // 单一弹簧：微颤只叠一次，两眼共用 → 不会各自抖
  const st=30+CFG.speed*340, dp=2*Math.sqrt(st)*.62, t=now/1000;
  const j=CFG.jitter;
  const mx=(Math.sin(t*1.7+gaze.seed)*.6+Math.sin(t*4.3+gaze.seed*2.7)*.3)*.08*j;
  const my=(Math.cos(t*2.3+gaze.seed*1.3)*.6+Math.cos(t*5.1+gaze.seed*3.1)*.3)*.06*j;
  gaze.vx+=((gaze.tx+mx-gaze.x)*st - gaze.vx*dp)*ds;
  gaze.vy+=((gaze.ty+my-gaze.y)*st - gaze.vy*dp)*ds;
  gaze.x+=gaze.vx*ds; gaze.y+=gaze.vy*ds;
  // 龙虾：只保留呼吸（螯不再甩动，整只就是一张静态还原图）
  if(styleMode==='crab'){
    crabBreath = Math.sin(now/CFG.crabBreatheMs*Math.PI*2) * CFG.crabBreathe;
  }else{
    crabBreath=0;
  }

  stepFling(now,ds);

  eyes.l.lid=eyeLid(now); eyes.r.lid=eyeLid(now);
  if(now>blink.next)doBlink();
}

/* 眼皮：0 = 全睁，1 = 闭合 */
function eyeLid(now){
  const bp=(now-blink.t0)/blink.dur;
  if(bp<0||bp>=1)return 0;
  if(bp<0.36){const u=bp/0.36;return u*u*(3-2*u);}
  const u=(bp-0.36)/0.64, e=u*u*(3-2*u);
  return clamp(1-e-Math.sin(u*Math.PI)*0.09*(1-u),0,1);
}

function bodyR(){ return CFG.bodySize/2*(1-press); }


/* ---------------- 弹飞物理 ---------------- */
/* 撞墙：挤一下 + 冲击波；撞完已经很慢就直接停，不然会贴着墙一点点抖 */
function bounceHit(now,x,y,spd){
  sqV += (FL.vx+FL.vy)*0.0022;
  if(spd>420){
    const str=clamp(spd/2600,0.25,1);
    RINGS.push({x,y,t0:now,str});
    if(RINGS.length>4) RINGS.shift();
    /* 撞哪面墙就朝哪个方向压：法线由反弹后的速度反推（速度刚被反向过），
       这里用撞击点相对球心的方向更稳 —— 球撞左墙时撞点在球心左侧。 */
    const R=CFG.bodySize/2*S;
    let nx=0, ny=0;
    const b=flingBounds();
    const bx=W*CFG.posX+FL.x, by=H*CFG.posY+FL.y;
    if(Math.abs(bx-b.minX)<Math.abs(bx-b.maxX)) nx=1; else nx=-1;
    if(Math.abs(by-b.minY)<Math.abs(by-b.maxY)) ny=1; else ny=-1;
    // 只取真正撞上的那个轴（撞左墙就只有 x 方向）
    const dxL=Math.abs(bx-b.minX), dxR=Math.abs(bx-b.maxX);
    const dyT=Math.abs(by-b.minY), dyB=Math.abs(by-b.maxY);
    const horiz=Math.min(dxL,dxR)<=Math.min(dyT,dyB);
    if(horiz) ny=0; else nx=0;
    const ang=Math.atan2(ny,nx);
    IMP.ang=ang; IMP.amp=str; IMP.t0=now; IMP.x=bx-nx*R*0.85; IMP.y=by-ny*R*0.85; IMP.spd=spd;
  }
  if(spd<CFG.flingStopSpd*2.5){ FL.flying=false; FL.vx=0; FL.vy=0; FL.homeT=now; }
}

/* 撞击形变：阻尼振荡 —— 先压扁、回弹时略微鼓起、再收敛回正圆。
   纯指数衰减看着像「慢慢变回去」，有振荡才有弹性。 */
function stepImpact(now,ds){
  const t=(now-IMP.t0)/1000;
  if(t<0 || t>1.2 || IMP.amp<=0){ IMP.str=0; return; }
  const env=Math.exp(-t/CFG.impDecay);
  IMP.str = IMP.amp * env * Math.cos(CFG.impFreq*t);
  // 余震：撞击后极短的一下高频抖动，沿法线
  IMP.shake = (t<0.14) ? IMP.amp*CFG.impShake*Math.exp(-t/0.045)*Math.sin(t*220) : 0;
}

/* 撞击形变 + 余震的变换（在球心局部坐标里用） */
function applyImpactWarp(c){
  const st=IMP.str;
  if(Math.abs(st)>0.0008){
    c.save();
    c.rotate(IMP.ang);
    const a=clamp(st,-1,1);
    // a>0 → 沿法线压扁、垂直方向鼓出；a<0（回弹）→ 反向，形成过冲
    c.scale(1-a*CFG.impSquash, 1+a*CFG.impBulge);
    c.rotate(-IMP.ang);
  }
  if(IMP.shake){
    c.translate(Math.cos(IMP.ang)*IMP.shake*40, Math.sin(IMP.ang)*IMP.shake*40);
  }
}
function endImpactWarp(c){
  if(Math.abs(IMP.str)>0.0008) c.restore();
}


/* 屏幕内的可停区域（球心） */
function flingBounds(){
  const R=CFG.bodySize/2*S;
  return {minX:R*0.9, maxX:Math.max(R*0.9, W-R*0.9),
          minY:R*0.9, maxY:Math.max(R*0.9, H-R*0.9)};
}

function stepFling(now,ds){
  // 过期清理：不管飞不飞都要跑，否则停下后残影会卡住不消失
  for(let i=TRAIL.length-1;i>=0;i--) if(now-TRAIL[i].t0>CFG.trailMs) TRAIL.splice(i,1);
  for(let i=RINGS.length-1;i>=0;i--) if(now-RINGS[i].t0>620) RINGS.splice(i,1);

  /* ---- 被拖着走：球用弹簧追手指，顺滑且自带一点滞后 ----
     这样不管指针事件多密、掉不掉帧，看起来都是连续运动。
     同时每帧记下球的真实速度，松手时直接拿它当甩出去的初速度（最贴合手感）。 */
  if(DRAG.on && DRAG.moved){
    const b=flingBounds();
    const gx=clamp(DRAG.tx, b.minX, b.maxX), gy=clamp(DRAG.ty, b.minY, b.maxY);
    const px=W*CFG.posX+FL.x, py=H*CFG.posY+FL.y;
    const k=1-Math.exp(-ds/CFG.dragFollowTau);
    const nx=px+(gx-px)*k, ny=py+(gy-py)*k;
    // 用实际位移反推速度（不是手指速度），所以"甩得快"和"球飞得快"是一致的
    const rawVx=(nx-px)/Math.max(ds,1e-4), rawVy=(ny-py)/Math.max(ds,1e-4);
    const sm=1-Math.exp(-ds/0.05);          // 平滑一下，避免单帧抖动
    DRAG.vx+=(rawVx-DRAG.vx)*sm; DRAG.vy+=(rawVy-DRAG.vy)*sm;
    DRAG.has=true;
    FL.x=nx-W*CFG.posX; FL.y=ny-H*CFG.posY;
    return;
  }
  if(!FL.flying) return;   // 停下后留在原地，不再往回跑

  /* ---- 飞行：固定 4ms 子步积分，掉帧时也不会一步跨过边界造成跳变 ---- */
  const sub=Math.min(8, Math.max(1, Math.ceil(ds/0.004))), hs=ds/sub;
  const damp=Math.exp(-CFG.flingDrag*hs);
  for(let i=0;i<sub;i++){
    FL.vx*=damp; FL.vy*=damp;
    const sp0=Math.hypot(FL.vx,FL.vy);
    if(sp0>0.001){
      const drop=Math.min(sp0, CFG.flingRoll*hs);
      FL.vx-=FL.vx/sp0*drop; FL.vy-=FL.vy/sp0*drop;
    }
    FL.x+=FL.vx*hs; FL.y+=FL.vy*hs;
    // 每个子步都做一次边界检测，高速时也不会穿墙
    const bb=flingBounds(), cx=W*CFG.posX+FL.x, cy=H*CFG.posY+FL.y;
    if(cx<bb.minX){ FL.x=bb.minX-W*CFG.posX; FL.vx=Math.abs(FL.vx)*CFG.flingBounce; bounceHit(now,cx,cy,Math.hypot(FL.vx,FL.vy)); }
    if(cx>bb.maxX){ FL.x=bb.maxX-W*CFG.posX; FL.vx=-Math.abs(FL.vx)*CFG.flingBounce; bounceHit(now,cx,cy,Math.hypot(FL.vx,FL.vy)); }
    if(cy<bb.minY){ FL.y=bb.minY-H*CFG.posY; FL.vy=Math.abs(FL.vy)*CFG.flingBounce; bounceHit(now,cx,cy,Math.hypot(FL.vx,FL.vy)); }
    if(cy>bb.maxY){ FL.y=bb.maxY-H*CFG.posY; FL.vy=-Math.abs(FL.vy)*CFG.flingBounce; bounceHit(now,cx,cy,Math.hypot(FL.vx,FL.vy)); }
    if(!FL.flying) break;
  }

  // 残影：飞得越快留得越多
  const spd0=Math.hypot(FL.vx,FL.vy);
  if(spd0>CFG.trailMinSpd){
    const px=W*CFG.posX+FL.x, py=H*CFG.posY+FL.y;
    const st=clamp(spd0/5200,0.25,1);
    // 速度太快时一帧能跨上百像素，中间补几个点，残影才不会断成虚线
    if(FL.lx!==undefined){
      const dx=px-FL.lx, dy=py-FL.ly, dist=Math.hypot(dx,dy);
      const n=Math.min(8, Math.floor(dist/34));
      for(let k=1;k<=n;k++){
        TRAIL.push({x:FL.lx+dx*k/(n+1), y:FL.ly+dy*k/(n+1), t0:now, s:st*0.8});
      }
    }
    FL.lx=px; FL.ly=py;
    TRAIL.push({x:px, y:py, t0:now, s:st});
    while(TRAIL.length>34) TRAIL.shift();
  }else{ FL.lx=undefined; FL.ly=undefined; }
  for(let i=TRAIL.length-1;i>=0;i--) if(now-TRAIL[i].t0>CFG.trailMs) TRAIL.splice(i,1);
  for(let i=RINGS.length-1;i>=0;i--) if(now-RINGS[i].t0>620) RINGS.splice(i,1);

  // 静摩擦：速度足够小 → 就地停住，停在哪就在哪（不再回到初始位置）
  if(FL.flying && Math.hypot(FL.vx,FL.vy)<CFG.flingStopSpd){
    FL.flying=false; FL.vx=0; FL.vy=0; FL.homeT=now;
  }
  // 兜底：飞太久就地停下
  if(FL.flying && FL.t0>0 && now-FL.t0>CFG.flingMaxMs){ FL.flying=false; FL.vx=0; FL.vy=0; }
}

/* 运动形变：绕当前中心，沿速度方向拉长、垂直方向压扁。
   速度 = 0 时拉伸量为 0 → 等价于没变换，球就是稳定的正圆。 */
function applyMotionWarp(c){
  if(MOTION.amt<=0.0005) return;
  c.rotate(MOTION.ang);
  c.scale(1+MOTION.amt, 1-MOTION.amt*CFG.motionSquash);
  c.rotate(-MOTION.ang);
}

/* 光晕层：三个 DOM 圆。每帧只写 transform（合成器友好），
   背景渐变只在尺寸 / 主题 / 配色变化时重设一次。 */
/* r = 绕圈半径，单位是「球半径的倍数」而不是像素。
   像素值是写死的：球一缩小（点击弹簧、大小滑块、换屏幕）绕圈轨迹还是那么大，
   光圈就会明显绕出球外 —— 这就是旋转半径比例不对的原因。用倍数才跟球同步。 */
const HALO_D=[
  {cL:'rgba(238,182,42,',  cD:'rgba(255,222,130,', a:.055, rs:1.055, w:0.52, ph:0.0, r:0.091},
  {cL:'rgba(248,128,172,', cD:'rgba(255,178,212,', a:.075, rs:1.03,  w:0.79, ph:2.1, r:0.083},
  {cL:'rgba(58,138,235,',  cD:'rgba(120,178,255,', a:.075, rs:1.01,  w:0.31, ph:4.3, r:0.076}
];
const haloWrap=document.getElementById('halos');
const haloEls=[...haloWrap.querySelectorAll('i')];
let HALO_KEY='';
function haloStyle(d){
  const dark=theme==='dark';
  const col=dark?d.cD:d.cL;
  const A=d.a*CFG.haloAlpha*(dark?CFG.haloDarkBoost:CFG.haloLightBoost);
  return 'radial-gradient(circle, '+col+A.toFixed(3)+') 0%, '
       + col+A.toFixed(3)+') 97%, '+col+'0) 100%)';
}
function updateHalos(now, cx, cy, BASE, t, sx, sy, ballR){
  // 只有屏幕尺寸 / 配色 / 主题变了才重建位图；缩放与形变一律走 scale
  const key=Math.round(BASE)+'|'+theme+'|'+CFG.haloAlpha+'|'+CFG.haloR+'|'+CFG.haloSway;
  if(key!==HALO_KEY){
    HALO_KEY=key;
    for(let i=0;i<haloEls.length;i++){
      const d=HALO_D[i], el=haloEls[i];
      const rr=BASE*d.rs*CFG.haloR;   // BASE 已含降采样 → scale 负责放大到实际尺寸
      el.style.width=Math.ceil(rr*2)+'px'; el.style.height=Math.ceil(rr*2)+'px';
      el.style.background=haloStyle(d);
      el.dataset.rr=rr;
    }
  }
  const kx=sx||1, ky=sy||1;
  /* 形变比要「相对未形变的球」来算，不能直接拿 sx ——
     sx = RX/BASE，而 BASE 是降采样后的基准，sx 里含着 1/haloDownscale 的放大因子。
     绕圈偏移是屏幕像素，再乘一遍它就会被放大 1.8 倍，比例再次跑掉。 */
  const wx=(ballR>0)?(kx*BASE/ballR):1, wy=(ballR>0)?(ky*BASE/ballR):1;
  for(let i=0;i<haloEls.length;i++){
    const d=HALO_D[i], el=haloEls[i];
    const rr=+el.dataset.rr||0;
    const a=t*d.w+d.ph;
    /* 绕圈半径 = 球半径 × d.r × 晃动系数 —— 球缩小/放大时轨迹同步缩放。
       再乘形变比 wx/wy：球压扁时光晕跟着压扁，不会还按正圆轨迹走。 */
    const ox=Math.cos(a)*d.r*ballR*CFG.haloSway*wx, oy=Math.sin(a)*d.r*ballR*CFG.haloSway*wy;
    el.style.transform='translate3d('+(cx+ox-rr).toFixed(1)+'px,'+(cy+oy-rr).toFixed(1)+'px,0)'
      + ' scale('+kx.toFixed(4)+','+ky.toFixed(4)+')';
  }
  if(haloWrap.style.display!=='block') haloWrap.style.display='block';
}
function hideHalos(){ if(haloWrap.style.display!=='none') haloWrap.style.display='none'; }

/* 球体径向渐变缓存：坐标相对球心，半径/配色不变就能复用 */
let BG_KEY='', BG_VAL=null;
function ballGrad(RX,RY){
  const key=Math.round(RX)+'|'+Math.round(RY)+'|'+SKIN.core+'|'+SKIN.rim;
  if(BG_KEY===key && BG_VAL) return BG_VAL;
  const g=ctx.createRadialGradient(-RX*0.14,-RY*0.18,RX*0.05, 0,0,Math.max(RX,RY)*1.02);
  g.addColorStop(0,   SKIN.core);
  g.addColorStop(.40, SKIN.in1);
  g.addColorStop(.72, SKIN.in2);
  g.addColorStop(.92, SKIN.edge);
  g.addColorStop(1,   SKIN.rim);
  BG_KEY=key; BG_VAL=g;
  return g;
}

/* 多边形 → Path2D 缓存。
   龙虾有 30 多个色块多边形，原来每帧都要 new 一遍并逐点走一遍路径，
   纯 CPU 开销。形状数据是常量，构建一次就能永久复用。 */
const PATH_CACHE=new WeakMap();
function polyPath(poly){
  let p=PATH_CACHE.get(poly);
  if(!p){ p=new Path2D(); addPoly(p,poly); PATH_CACHE.set(poly,p); }
  return p;
}
function polyPathFrom(arr){
  let p=PATH_CACHE.get(arr);
  if(!p){
    p=new Path2D();
    for(const poly of arr){ const q=polyPath(poly); p.addPath(q); }
    PATH_CACHE.set(arr,p);
  }
  return p;
}

/* ---------------- 绘制 ---------------- */
function draw(now){
  applyLayout();
  const bs=CFG.bodySize, R=bodyR()*S;
  // 锚点用「未缩放」的半径来算，否则球变大时 cx0/cy0 会跟着往左上跑，
  // 看起来就像朝左上角缩放。现在球始终绕自己的中心缩放。
  const R0=CFG.bodySize/2*S;
  cx0=W*CFG.posX+FL.x; cy0=H*CFG.posY+FL.y;
  ES = S*(1-press);                   // 眼睛随球一起缩

  // 背景是不透明的，fillRect 本身就完成了清屏，不需要再 clearRect 一遍
  ctx.clearRect(0,0,W,H);   // 画布透明，底色由 body 提供；光晕层才能透上来

  /* 整体透明度只作用于角色本身（光晕 / 残影 / 冲击波 / 主角），
     对话框保持不透明，保证文字始终可读。 */
  const AL=clamp(CFG.alpha,0.05,1);
  ctx.save();
  ctx.globalAlpha=AL;

  // 果冻形变：横向膨胀 / 纵向压扁（sq>0 → 扁，<0 → 长）
  // 果冻：竖向拉伸更明显（上下拉长的幅度大于横向变窄），像被拎起来又落下
  const RX=R*(1+sq*0.5*CFG.stretchX), RY=R*(1-sq*0.5*CFG.stretchY);
  const BASE=Math.max(RX,RY);

  // 球底下有三个特别淡的圆：蓝、粉、黄。
  // 大小都跟球差不多，一直在轻微晃动；中心被球盖住，只在边缘透出一圈淡彩。
  if(CFG.halo && styleMode!=='crab'){   // 龙虾是还原图，不要三色光晕
    /* 光晕改由 DOM 层渲染（见 updateHalos）：三个大圆如果留在 canvas 里，
       每帧要填充上百万个半透明像素，是最大的性能瓶颈；
       交给合成器后主循环只剩三次 transform 写入。 */
    /* 光晕位图按「未缩放」的球半径建一次固定尺寸，所有缩放（点击弹簧 + 果冻形变）
       都交给 scale。这样 press 连续变化时不会每帧重建位图，而且光晕和球用同一个
       (RX,RY) 形变比 —— 球压扁时光晕同步压扁，露出的边始终均匀，比例不会跑。 */
    /* 光晕元素按 haloDownscale 建小，再靠 scale 放大到目标尺寸 ——
       它是一团极淡的柔和渐变，放大采样肉眼看不出差别，但光栅化面积大幅下降。
       scale 用球的 (RX,RY) 形变比，所以球压扁时光晕同步压扁，露出的边始终均匀。 */
    const hb=CFG.bodySize/2*S*CFG.haloDownscale;
    updateHalos(now, cx0, cy0, hb, now/1000, RX/hb, RY/hb, bodyR()*S);
  } else hideHalos();

  // 飞行残影：越旧越淡越小
  for(const tr of TRAIL){
    const age=(now-tr.t0)/CFG.trailMs;
    const a=(1-age)*0.30*tr.s;
    if(a<=0.004) continue;
    const rr=BASE*(1-age*0.30);
    ctx.globalAlpha=a;
    ctx.fillStyle=SKIN.in2;
    ctx.beginPath();ctx.arc(tr.x,tr.y,rr,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=AL;

  /* 撞击涟漪：一整片软环带。
     关键是用径向渐变「填充」而不是「描边」—— 描边画出来是一条细细的硬线，
     几个叠在一起就是几个圈；填充出来的径向渐变从内沿到外沿是连续的，
     中间没有任何硬边界，所以看着就是一个有厚度、有渐变的圆在扩散。 */
  if(RINGS.length && styleMode!=='crab'){
    // 必须跟球用同一个缩放基准（bodyR 已含 press），否则点击缩小时球小了波没小 → 比例失调
    const R0=bodyR()*S;
    for(const w of RINGS){
      const age=(now-w.t0)/CFG.impWaveMs;
      if(age<0 || age>=1) continue;
      const e=1-Math.pow(1-age,2.2);                        // 扩散先快后慢
      const rMid=R0*(0.42+e*CFG.impWaveSpread);             // 环带中心半径
      const th=R0*CFG.impWaveThick*(0.60+age*0.85);         // 波在扩散中逐渐摊开
      const rIn=Math.max(0.01, rMid-th), rOut=rMid+th;
      if(rOut<=rIn+0.5) continue;
      const a=w.str*CFG.impWave*Math.pow(1-age,1.35);       // 整体慢慢消失
      if(a<0.004) continue;
      /* 停靠点用高斯包络算出来，而不是手敲几个值 ——
         手敲的折线在段与段的接缝处会有可察觉的转折，
         高斯钟形是数学上平滑的，径向明暗是真正的连续过渡，找不到任何硬边。 */
      const g=ctx.createRadialGradient(w.x,w.y,rIn, w.x,w.y,rOut);
      const pk=CFG.impWavePeak, fw=CFG.impWaveFall, NS=CFG.impWaveStops;
      const cr=toRGB(SKIN.rim), ce=toRGB(SKIN.edge);
      for(let k=0;k<=NS;k++){
        const t=k/NS;
        const u=(t-pk)/fw;
        const env=Math.exp(-u*u);                       // 钟形包络
        const R2=Math.round(lerp(cr[0],ce[0],t));
        const G2=Math.round(lerp(cr[1],ce[1],t));
        const B2=Math.round(lerp(cr[2],ce[2],t));
        g.addColorStop(t, 'rgba('+R2+','+G2+','+B2+','+env.toFixed(3)+')');
      }
      ctx.globalAlpha=a;
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(w.x,w.y,rOut,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=AL;

  if(styleMode==='crab'){
    drawCrab(now);
    ctx.restore();                 // 结束透明度作用域
    drawBubble(now);
    return;
  }

  // 球体：里面是深的，往边缘逐渐变浅（外面那层浅的裹着它）
  // 形变 = 果冻(sq，轴对齐) × 运动拉伸(沿速度方向)，两者靠矩阵自然复合
  ctx.save();
  ctx.translate(cx0,cy0);
  applyMotionWarp(ctx);
  applyImpactWarp(ctx);
  /* 球体渐变缓存：坐标是相对球心的（已 translate），只要半径和配色不变就能复用。
     原来每帧新建一个 5 停靠点的渐变，是仅次于光晕的第二大开销。 */
  ctx.fillStyle=ballGrad(RX,RY);
  ctx.beginPath();ctx.ellipse(0,0,RX,RY,0,0,Math.PI*2);ctx.fill();
  endImpactWarp(ctx);
  ctx.restore();

  // 两眼：竖向白色胶囊（矩形 + 两端半圆），贴在球面上
  const ew=eyeW();
  const bx=CFG.eyeGap+ew/2;                 // 眼睛中心到球心的距离
  updateSharedRot(gaze.x, gaze.y);
  drawEye(-bx, CFG.eyeY, 'l', eyes.l.lid);
  drawEye( bx, CFG.eyeY, 'r', eyes.r.lid);

  ctx.restore();                   // 结束透明度作用域（对话框保持清晰）
  drawBubble(now);
}

/* bx/by = 眼睛在球面上的基础位置（逻辑像素，相对球心）
   实际位置、倾角、透视缩放都由 eyePose 算出 */
function drawEye(bx,by,side,lid){
  const ew=eyeW(), eh=eyeH();
  const rx=ew/2, ry=eh/2;
  const E=eyes[side];
  const P=eyePose(bx,by,gaze.x,gaze.y);

  // 眼皮：从上方往下压，压掉的部分露出球体本身（局部坐标）
  const [ya,yb]=lidCut(ry,eh,lid,side,CFG.lidSlant);

  // 两眼作为一组绕球心刚体旋转 sharedRot：
  // 于是「两眼连线」也跟着倾斜，而两只眼自身转同样角度 → 始终平行
  const cs=Math.cos(P.rot), sn=Math.sin(P.rot);
  const px=P.x*cs - P.y*sn;
  const py=P.x*sn + P.y*cs;

  drawKimiEye(px,py,P.rot,1, rx,ry,side,lid,ya,yb);
}

/* 共用：Kimi 的眼睛本体（竖向白色胶囊 + 眼皮斜切）。
   原版小球与龙虾里的 Kimi 都走这一套 —— 形状、眨眼、生气完全同款 */
function drawKimiEye(px,py,rot,sc, rx,ry,side,lid,ya,yb){
  ctx.save();
  ctx.translate(ex_(px), ey_(py));
  ctx.rotate(rot);
  ctx.scale(ES*sc, ES*sc);
  kimiEyeShape(rx,ry,ya,yb);
  ctx.restore();
}
/* 眼睛本体：假定变换已经移到眼心。斜切的上边缘 ya/yb 决定眨眼与生气 */
function kimiEyeShape(rx,ry,ya,yb){
  ctx.beginPath();
  ctx.moveTo(-rx-1, ya);
  ctx.lineTo( rx+1, yb);
  ctx.lineTo( rx+1, ry+1);
  ctx.lineTo(-rx-1, ry+1);
  ctx.closePath();ctx.clip();
  capsule(rx,ry);
}
/* 眼皮斜切量：与眨眼同款。生气时外高内低斜切（与 Kimi 一致） */
function lidCut(ry,eh,lid,side,slant){
  const angry = MOOD()==='angry' && rage>0.01;
  const al = angry ? CFG.angryLid*rage : 0;
  const cut = -ry + eh*Math.max(lid, al);
  const sl = angry ? (slant==null?CFG.lidSlant:slant)*(1-al*0.35) : 0;
  const yOut=cut-sl, yIn=cut+sl;
  return side==='l' ? [yOut,yIn] : [yIn,yOut];
}

/* 把点数组写进 Path2D（首点即起点） */
/* 龙虾的坐标是「以自身中心为原点、单位为 1」的归一化坐标，
   画之前已经 translate 到中心并 scale(R)，所以这里直接用原始值，不能加 cx0/cy0。 */
function addPoly(path, pts){
  path.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length;i++) path.lineTo(pts[i][0], pts[i][1]);
  path.closePath();
}

/* 龙虾自己的黑眼（触角顶端，带右上角白色矩形高光）+ Kimi 的白眼（面罩上）
   两对眼睛的坐标、尺寸全部由原图逐像素量取：
     黑眼 左(-0.128,-0.281) r0.045/0.087 ／ 右(0.083,-0.292) r0.042/0.083
     白眼 左(-0.038,0.174)  r0.052/0.090 ／ 右(0.222,0.156) r0.049/0.087
   白眼两眼取同尺寸、同一水平线（y=0.165）。 */
const CRAB_EYES=[[-0.128,-0.281,0.045,0.087],[0.083,-0.292,0.042,0.083]];
const CRAB_KIMI=[[-0.038,0.165,0.0505,0.0885],[0.222,0.165,0.0505,0.0885]];

/* 龙虾不再画自己那对黑眼 —— 眼睛由 Kimi 的白色胶囊眼叠上去，避免两层眼睛打架 */



/* 竖向胶囊（矩形 + 两端圆），跟 Kimi 原版同形状；两端用多边形近似圆弧 → 边有棱角 */
function capsulePath(rx,ry,seg){
  const w=rx, h=ry, r=Math.min(w,h);
  const pts=[];
  const corner=(cx,cy,a0,a1)=>{
    for(let i=0;i<=seg;i++){
      const t=a0+(a1-a0)*(i/seg);
      pts.push([cx+r*Math.cos(t), cy+r*Math.sin(t)]);
    }
  };
  corner(-w+r,-h+r, Math.PI,        Math.PI*1.5);   // 左上
  corner( w-r,-h+r, Math.PI*1.5,    Math.PI*2  );   // 右上
  corner( w-r, h-r, 0,              Math.PI*0.5);   // 右下
  corner(-w+r, h-r, Math.PI*0.5,    Math.PI    );   // 左下
  const q=new Path2D();
  q.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) q.lineTo(pts[i][0],pts[i][1]);
  q.closePath();
  return q;
}

function drawCrab(now){
  updateSharedRot(gaze.x, gaze.y);   // 两眼共用倾角，与原版一致
  // 整体缩放 = 呼吸 × 点击弹簧（press 负=放大、正=缩小）
  const sc=(1+crabBreath)*(1-press);
  const R=CFG.bodySize/2*S*CFG.crabScale*sc;
  const P=crabPal();
  const r=(now<rageUntil&&rage>0.01)?rage:0;
  const shake=r?Math.sin(now/58)*r*0.018:0;
  const lid=eyes.l.lid;

  ctx.save();
  ctx.translate(cx0+shake, cy0);
  ctx.scale(R,R);

  /* 1. 龙虾本体：纯矢量多边形大色块，按面积从大到小铺，每层都完整覆盖自己的区域。
        层与层不会留缝，因为底层就是整只轮廓的实色，上面几层只是叠色块。
        全部硬边纯色、无渐变、无阴影 —— 和原图的扁平平涂一致。 */
  const bp0=polyPath(CRAB_SIL);
  ctx.lineJoin='round';
  ctx.fillStyle=P.b2; ctx.fill(bp0);                       // 红中档：铺满整只（底）
  ctx.strokeStyle=P.b2; ctx.lineWidth=0.004; ctx.stroke(bp0);
  ctx.save(); ctx.clip(bp0);
  ctx.fillStyle=P.b3; ctx.strokeStyle=P.b3; ctx.lineWidth=0.004;
  for(const poly of CRAB_DRK){ const q=polyPath(poly); ctx.fill(q); ctx.stroke(q); }
  ctx.fillStyle=P.b1; ctx.strokeStyle=P.b1; ctx.lineWidth=0.004;
  for(const poly of CRAB_LIT){ const q=polyPath(poly); ctx.fill(q); ctx.stroke(q); }
  ctx.restore();

  /* 2. 蓝色面罩：暗档打底 → 亮块叠上（原图蓝面罩 暗35% / 亮65%） */
  const mp=polyPath(CRAB_MASK);
  ctx.fillStyle=P.m2; ctx.fill(mp);
  ctx.strokeStyle=P.m2; ctx.lineWidth=0.004; ctx.stroke(mp);
  ctx.save(); ctx.clip(mp);
  ctx.fillStyle=P.m1; ctx.strokeStyle=P.m1; ctx.lineWidth=0.004;
  for(const poly of CRAB_MBRK){ const q=polyPath(poly); ctx.fill(q); ctx.stroke(q); }
  ctx.restore();

  /* 3. 龙虾自己的黑眼：触角顶端的竖向胶囊，右上角一小块白色矩形高光，
        被眼形裁掉后看着像「露出的一角」。静态，不眨眼。 */
  for(const [ex,ey,erx,ery] of CRAB_EYES){
    ctx.save(); ctx.translate(ex,ey);
    const ep=capsulePath(erx, ery, 5);
    ctx.fillStyle=P.eye; ctx.fill(ep);
    ctx.save(); ctx.clip(ep);
    ctx.fillStyle=P.eyeHi;
    ctx.fillRect(erx*0.55-erx*0.45, -ery*0.60-ery*0.365, erx*0.90, ery*0.73);
    ctx.restore(); ctx.restore();
  }

  /* 4. Kimi 的眼睛：面罩上的两个白色竖向胶囊
        形状、眨眼、生气斜切 —— 走和原版小球同一个 kimiEyeShape() */
  const gx=gaze.x*0.042, gy=gaze.y*0.026;
  ctx.save();
  ctx.clip(mp);
  for(let i=0;i<CRAB_KIMI.length;i++){
    const [ex,ey,erx,ery]=CRAB_KIMI[i];
    const sd=i?'r':'l';
    const [ya,yb]=lidCut(ery,ery*2,lid,sd,CFG.crabLidSlant);  // 蟹眼短 → 斜切放轻
    ctx.save();
    ctx.translate(ex+gx, ey+gy);   // 龙虾：只跟着视角平移，不歪斜
    kimiEyeShape(erx, ery, ya, yb);
    ctx.restore();
  }
  ctx.restore();

  ctx.restore();
}

/* 圆角长方形对话框：居中显示，文字打字机效果逐字出现 */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function bubbleBox(now){
  const fs=Math.max(16, Math.round(Math.min(W,H)*0.042));
  const txt=curLinesArr()[bubbleIdx]||'';
  ctx.font='500 '+fs+'px -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif';
  const tw=ctx.measureText(txt).width;
  const w=clamp(tw+fs*2.2, Math.min(W*0.46, W-28), W*0.90), h=fs*3.1;
  const r=Math.min(h*0.42, fs*1.0);
  return {x:clamp(W*CFG.bubbleX-w/2, 12, W-w-12),
          y:clamp(H*CFG.bubbleY-h/2, 12, H-h-12), w, h, r, fs, txt};
}

function drawBubble(now){
  if(!bubbleShown || bubbleIdx<0) return;
  const B=bubbleBox(now);
  const age=now-bubbleT0;
  // 淡入
  const a=clamp(age/240, 0, 1);

  ctx.save();
  ctx.globalAlpha=a;
  ctx.shadowColor=TH().cardShadow;
  ctx.shadowOffsetY=Math.max(2,B.h*0.10);
  ctx.shadowBlur=B.h*0.55;
  ctx.fillStyle=TH().card;
  roundRect(B.x,B.y,B.w,B.h,B.r); ctx.fill();
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  ctx.strokeStyle=TH().cardBorder;
  ctx.lineWidth=1;
  roundRect(B.x,B.y,B.w,B.h,B.r); ctx.stroke();

  // 打字机：按字数逐字吐出
  ctx.font='500 '+B.fs+'px -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle='#33415c';
  const shown=clamp(Math.floor(age/CFG.typeMs), 0, B.txt.length);
  const part=B.txt.slice(0,shown);
  const pw=ctx.measureText(part).width;
  ctx.fillText(part, B.x+(B.w-pw)/2, B.y+B.h/2);   // 已出现的部分保持居中

  // 光标：打完前闪烁
  if(shown<B.txt.length && Math.floor(age/380)%2===0){
    ctx.fillStyle=TH().fg;
    ctx.fillRect(B.x+(B.w-pw)/2+pw+1, B.y+B.h/2-B.fs*0.42, Math.max(1,B.fs*0.08), B.fs*0.84);
  }
  ctx.restore();
}

/* 竖向胶囊：中间矩形 + 两端半圆，以 (0,0) 为中心、逻辑单位
   白色不是贴在球面上的，而是被外面那层深蓝包裹着、从里面透出来的光。
   所以：本体是中心纯白、边缘转蓝白的渐变，外圈再散一圈蓝白辉光。 */
function capsule(rx,ry){
  const r=Math.min(rx,ry)*CFG.eyeRound;   // 圆角：越小越接近圆角矩形（更钝）
  const flat=Math.max(0, ry-r);           // 直边半长
  ctx.beginPath();
  ctx.arc(0, -flat, r, Math.PI, 0);       // 上端半圆
  ctx.lineTo(rx, flat);                   // 右侧直边
  ctx.arc(0, flat, r, 0, Math.PI);        // 下端半圆
  ctx.closePath();

  ctx.fillStyle='#ffffff';   // 纯白，不掺蓝
  ctx.fill();
}

let exeInfoDone=false;
async function loadExeInfo(){
  if(exeInfoDone) return;
  exeInfoDone=true;
  try{
    const r=await fetch(EXE_API+'/api/info'+EXE_Q, {mode:'cors', cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.download_url) exeUrl=d.download_url;
    else if(d.endpoints && d.endpoints.length) exeUrl=d.endpoints[0];
    exeMeta.textContent=[d.size_human, d.version?('v'+d.version):''].filter(Boolean).join(' · ') || 'Windows 版';
  }catch(e){
    exeMeta.textContent='Windows 版';
  }
}

  ask.classList.add('open');
  ask.removeAttribute('inert'); ask.setAttribute('aria-hidden','false');
  askYes.focus();
}
function closeAsk(force){
  if(askBusy && !force) return;
  ask.classList.remove('open');
  ask.setAttribute('inert',''); ask.setAttribute('aria-hidden','true');
}
dlBtn.addEventListener('pointerdown',e=>e.stopPropagation());
dlBtn.addEventListener('click',openAsk);
askNo.addEventListener('click',()=>closeAsk());
pApk.addEventListener('click',()=>setPlat('apk'));
pExe.addEventListener('click',()=>setPlat('exe'));

function doDownload(){
  if(askBusy) return;
  askBusy=true; askNo.disabled=true; askYes.disabled=true;
  const url = plat==='apk' ? APK_URL : exeUrl;
  // 只切换显示，不替换 innerHTML —— 平台按钮的节点必须留着
  askBody.hidden=true; dlProg.hidden=false;
  /* exe 是 attachment 响应，用 location.href 浏览器会直接下载且留在当前页；
     APK 那个是落地页，放新标签打开，免得把正在玩的小球顶掉。 */
  if(plat==='apk'){
    const w=window.open(url,'_blank','noopener');
    if(!w){                       // 被拦截就直接跳
      const a=document.createElement('a');
      a.href=url; a.target='_blank'; a.rel='noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
  }else{
    location.href=url;
  }
  askBusy=false;
  setTimeout(()=>{
    closeAsk(true);
    askBody.hidden=false; dlProg.hidden=true;
    askNo.disabled=false; askYes.disabled=false;
  },700);
}
askYes.addEventListener('click',doDownload);

/* ---------------- 自定义颜色：三条滑块（色相 / 饱和度 / 明度） ---------------- */
const hueR=document.getElementById('hueR'),  hueV=document.getElementById('hueV');
const satR=document.getElementById('satR'),  satV=document.getElementById('satV');
const litR=document.getElementById('litR'),  litV=document.getElementById('litV');
const pickHex=document.getElementById('pickHex');
const resetC=document.getElementById('resetC');

const PK={h:215,s:65,l:57};

function syncSliders(){
  hueR.value=PK.h; satR.value=PK.s; litR.value=PK.l;
  hueV.textContent=PK.h; satV.textContent=PK.s; litV.textContent=PK.l;
  // 饱和度条：当前色相下 低饱和 → 高饱和
  satR.style.setProperty('--satTrack',
    'linear-gradient(90deg,'+hsl(PK.h,0,PK.l)+','+hsl(PK.h,100,PK.l)+')');
  // 明度条：当前色相饱和度下 暗 → 亮
  litR.style.setProperty('--litTrack',
    'linear-gradient(90deg,'+hsl(PK.h,PK.s,22)+','+hsl(PK.h,PK.s,86)+')');
}

function applyPicker(keepFixed){
  hueH=PK.h; hueS=PK.s; hueL=PK.l;
  if(!keepFixed){ fixedSkin=null; LS.set('fix','0'); }   // 手动调 → 交回 HSL
  skinFromHue(PK.h,PK.s,PK.l);
  if(fixedSkin) Object.assign(SKIN, fixedSkin);
  pickHex.textContent=fixedSkin?fixedSkin.core:hsl2hex(PK.h,PK.s,PK.l);
  LS.set('hsl', PK.h+','+PK.s+','+PK.l);
  if(!fixedSkin) [...swWrap.children].forEach(b=>b.classList.remove('on'));
  syncSliders();
}

/* 样式切换：原版 / 龙虾 */
const styleSeg=document.getElementById('styleSeg');
function setStyle(t){
  styleMode=t; LS.set('style',t);
  [...styleSeg.children].forEach(b=>b.classList.toggle('on', b.dataset.style===t));
  // 清掉飞行/放大/甩爪的残留状态，切换后干净起步
  FL.flying=false; FL.x=0; FL.y=0; FL.vx=0; FL.vy=0; FL.homeT=-99999; FL.t0=-99999;
  TRAIL.length=0; RINGS.length=0;
  IMP.amp=0; IMP.str=0; IMP.shake=0; IMP.t0=-99999;
  press=0; pressV=0; popUntil=-99999; sq=0; sqV=0;
  if(typeof loadLines==='function') loadLines();   // 切样式 → 文案框跟着换
}
[...styleSeg.children].forEach(b=>b.addEventListener('click',()=>setStyle(b.dataset.style)));

/* ---------------- 大小 / 透明度 / 文案 ---------------- */
const sizeR=document.getElementById('sizeR'), sizeV=document.getElementById('sizeV');
const alphaR=document.getElementById('alphaR'), alphaV=document.getElementById('alphaV');
const lineHint=document.getElementById('lineHint');
const lineIn=[0,1,2].map(i=>document.getElementById('line'+i));
const resetL=document.getElementById('resetL');

function setSizeK(k){
  const v=clamp(k,0.5,2);
  CFG.sizeK=v; SIZE_K=v;
  LS.set('size', v);
  sizeR.value=Math.round(v*100);
  sizeV.textContent=Math.round(v*100)+'%';
  resize();                                  // S 由屏幕尺寸算出，必须重算
  // 大小变了，飞行边界也跟着变，夹一下避免卡在屏幕外
  const b=flingBounds();
  const nx=W*CFG.posX+FL.x, ny=H*CFG.posY+FL.y;
  FL.x=clamp(nx,b.minX,b.maxX)-W*CFG.posX;
  FL.y=clamp(ny,b.minY,b.maxY)-H*CFG.posY;
}
function setAlpha(a){
  CFG.alpha=clamp(a,0.2,1);
  LS.set('alpha', CFG.alpha);
  alphaR.value=Math.round(CFG.alpha*100);
  alphaV.textContent=Math.round(CFG.alpha*100)+'%';
}
/* 文案：两套各自存，切样式时输入框跟着换 */
function linesKey(){ return styleMode==='crab' ? 'lines_crab' : 'lines_ball'; }
function loadLines(){
  const key=linesKey(), arr=curLines();
  const raw=LS.get(key,'');
  const saved=raw?raw.split('\u0001'):null;
  for(let i=0;i<3;i++){
    arr[i]= (saved && saved[i]!==undefined) ? saved[i] : DEFAULT_LINES[styleMode][i];
    lineIn[i].value=arr[i];
  }
  lineHint.textContent='狂点时依次弹出这三句（当前：'+(styleMode==='crab'?'龙虾':'原版')+'，留空则不显示）';
}
function saveLines(){
  LS.set(linesKey(), curLines().join('\u0001'));
  bubbleIdx=-1;                              // 改完立刻生效，下一次狂点就是新文案
}
lineIn.forEach((el,i)=>{
  el.addEventListener('input',()=>{ curLines()[i]=el.value; saveLines(); });
});
resetL.addEventListener('click',()=>{
  const arr=curLines(), d=DEFAULT_LINES[styleMode];
  for(let i=0;i<3;i++){ arr[i]=d[i]; lineIn[i].value=d[i]; }
  saveLines();
});

const onRange=(el,fn)=>{ el.addEventListener('input',()=>fn(+el.value)); };
onRange(sizeR,v=>setSizeK(v/100));
onRange(alphaR,v=>setAlpha(v/100));
onRange(hueR,v=>{ PK.h=v; applyPicker(false); });
onRange(satR,v=>{ PK.s=v; applyPicker(false); });
onRange(litR,v=>{ PK.l=v; applyPicker(false); });

resetC.addEventListener('click',()=>{
  setHue('blue');                    // 走预设 → 拿到写死的原版色值
  PK.h=215; PK.s=65; PK.l=57;
  applyPicker(true);
});

const savedHSL=(LS.get('hsl','')||'').split(',');
// 大小 / 透明度：恢复存档（setSizeK 会调 resize，要在布局稳定后跑）
setSizeK(+LS.get('size','1')||1);
setAlpha(+LS.get('alpha','1')||1);
loadLines();

// fix 标记要在 setHue() 之前读：setHue 自己也会写它，会覆盖掉上次的记录
const isFixed = LS.get('fix','1')==='1';
setStyle(LS.get('style','ball')==='crab'?'crab':'ball');
setHue(HUES.some(x=>x.id===LS.get('hue','blue')) ? LS.get('hue','blue') : 'blue');
setTheme(LS.get('theme','light')==='dark'?'dark':'light');
// 恢复自定义值：若上次停在「原版默认色」，就不要用 HSL 覆盖它
if(!isFixed && savedHSL.length===3 && !isNaN(+savedHSL[0])){
  PK.h=+savedHSL[0]; PK.s=+savedHSL[1]; PK.l=+savedHSL[2];
  applyPicker(false);
}else{
  applyPicker(true);                   // 保持原版色 / 同步滑块显示
}

/* ---------------- 主循环 ---------------- */
let prev=0;
function frame(now){
  const dt=prev?now-prev:16;
  prev=now;
  // 累计掉帧约 1.2 秒才降档，太灵敏会在临界点反复抖动
  if(dprCap>2){
    if(dt>22){ dprSlow+=dt; if(dprSlow>1200){ dprCap=2; dprSlow=0; resize(); } }
    else dprSlow=Math.max(0, dprSlow-dt*0.5);
  }
  step(now,dt);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
